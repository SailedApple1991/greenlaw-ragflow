# ===================================================================
# RAGFlow AWS 部署专用 Docker Compose
# ===================================================================
# 只启动 ragflow 和 infinity，不启动 mysql/redis/minio
# 这些服务由 AWS RDS/ElastiCache/S3 提供
# ===================================================================

services:
  ragflow:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:dev}
    container_name: ragflow-server
    ports:
      - ${SVR_WEB_HTTP_PORT:-80}:80
      - ${SVR_WEB_HTTPS_PORT:-443}:443
      - ${SVR_HTTP_PORT:-9380}:9380
      - ${ADMIN_SVR_HTTP_PORT:-9381}:9381
    volumes:
      - ./ragflow-logs:/ragflow/logs
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Singapore}
    networks:
      - ragflow
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      infinity:
        condition: service_healthy

  infinity:
    image: infiniflow/infinity:v0.6.6
    container_name: ragflow-infinity
    volumes:
      - infinity_data:/var/infinity
      - ./infinity_conf.toml:/infinity_conf.toml
    command: ["-f", "/infinity_conf.toml"]
    ports:
      - ${INFINITY_THRIFT_PORT:-23817}:23817
      - ${INFINITY_HTTP_PORT:-23820}:23820
      - ${INFINITY_PSQL_PORT:-5432}:5432
    env_file: .env
    mem_limit: ${MEM_LIMIT:-8589934592}
    ulimits:
      nofile:
        soft: 500000
        hard: 500000
    networks:
      - ragflow
    healthcheck:
      test: ["CMD", "curl", "http://localhost:23820/admin/node/current"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: on-failure

volumes:
  infinity_data:
    driver: local

networks:
  ragflow:
    driver: bridge
