# =============================================================================
# RunPod OCR Service 自动部署工作流
# =============================================================================
# 触发条件：ocr-service 目录下文件变更
# 功能：构建 PaddleOCR GPU Docker 镜像并推送到 Docker Hub
# RunPod 会自动拉取最新镜像
# =============================================================================

name: Deploy OCR Service to RunPod

on:
  push:
    paths:
      - 'ocr-service/**'
    branches:
      - aliyun-deploy
      - main
  workflow_dispatch:  # 允许手动触发

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/paddleocr-runpod

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 清理磁盘空间 (PaddleOCR 镜像较大)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      # 3. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 生成镜像标签
      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      # 6. 构建并推送 Docker 镜像
      - name: Build and push OCR Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ocr-service
          file: ./ocr-service/Dockerfile.runpod
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. 输出部署信息
      - name: Deployment info
        run: |
          echo "============================================"
          echo "OCR Docker 镜像已推送到 Docker Hub"
          echo "镜像: ${{ env.IMAGE_NAME }}:latest"
          echo "版本: ${{ steps.meta.outputs.tag }}"
          echo "============================================"
          echo ""
          echo "RunPod 会自动拉取最新镜像。"
          echo "如需手动更新，请在 RunPod 控制台重启 Endpoint。"

      # 8. Discord 通知 (可选)
      - name: Discord notification
        if: always() && secrets.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "OCR Service 部署"
          description: |
            镜像: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          color: ${{ job.status == 'success' && '0x00ff00' || '0xff0000' }}
